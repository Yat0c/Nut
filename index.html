<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เดอ วารี — สั่งอาหารออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Noto+Serif+Thai:wght@400;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7ef;
    --panel:#ffffff;
    --panel-2:#fdfbf4;
    --hair:#e8dfc6;
    --gold:#b9902c;
    --gold-bright:#caa23c;
    --gold-deep:#8a6a1c;
    --ink:#2b2113;
    --muted:#8a7d5f;
    --drinks:#b9902c;
    --dessert:#8c9a5a;
    --seafood:#bd6b3c;
    --pasta:#c79a41;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(1200px 480px at 50% -8%, #fff9ea 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans Thai', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:90px;
  }
  .serif{ font-family:'Noto Serif Thai','Cormorant Garamond', serif; }

  .eyebrow{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:11px; letter-spacing:.35em; text-transform:uppercase;
    color:var(--gold-deep); font-weight:600; margin-bottom:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:""; width:26px; height:1px; background:linear-gradient(90deg, transparent, var(--gold));
  }
  .eyebrow::after{ background:linear-gradient(90deg, var(--gold), transparent); }

  header.hero{
    position:relative;
    text-align:center;
    padding:56px 20px 34px;
    border-bottom:1px solid var(--hair);
    overflow:hidden;
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(185,144,44,.07) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, rgba(185,144,44,.07) 0 1px, transparent 1px 64px);
    mask-image: radial-gradient(circle at 50% 0%, black 0%, transparent 70%);
    pointer-events:none;
  }
  header.hero h1{
    font-size:clamp(34px, 6vw, 54px);
    font-weight:600;
    letter-spacing:.04em;
    color:var(--ink);
  }
  header.hero h1 span{ color:var(--gold-deep); font-style:italic; }
  header.hero p.tag{
    margin-top:10px; color:var(--muted); font-size:14px; letter-spacing:.08em;
  }

  nav.tabs{
    position:sticky; top:0; z-index:30;
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    padding:14px 12px;
    background:rgba(250,247,239,.92);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--hair);
  }
  nav.tabs button{
    font-family:'Noto Sans Thai',sans-serif;
    background:#fff;
    border:1px solid var(--hair);
    color:var(--muted);
    padding:9px 18px;
    border-radius:30px;
    font-size:13.5px;
    letter-spacing:.03em;
    cursor:pointer;
    display:flex; align-items:center; gap:7px;
    transition:.25s;
  }
  nav.tabs button .dot{
    width:7px; height:7px; border-radius:50%; background:var(--cat-color, var(--gold));
    opacity:.6;
  }
  nav.tabs button.active{
    color:#fff;
    background:var(--cat-color, var(--gold));
    border-color:var(--cat-color, var(--gold));
    font-weight:600;
    box-shadow:0 8px 18px -8px color-mix(in srgb, var(--cat-color) 60%, transparent);
  }
  nav.tabs button.active .dot{ background:#fff; opacity:1;}
  nav.tabs button:hover:not(.active){ border-color:var(--cat-color, var(--gold)); color:var(--ink); }

  main{ max-width:1180px; margin:0 auto; padding:38px 20px 20px; }
  section.category{ display:none; animation:fade .4s ease; }
  section.category.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .section-head{ text-align:center; margin-bottom:30px; }
  .section-head h2{ font-size:clamp(24px,4vw,32px); font-weight:600; }
  .section-head p{ color:var(--muted); font-size:13.5px; margin-top:6px; max-width:520px; margin-inline:auto; }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:18px;
  }

  .card{
    background:linear-gradient(180deg, #ffffff, var(--panel-2));
    border:1px solid var(--hair);
    border-radius:14px;
    padding:22px 18px 18px;
    position:relative;
    transition:.25s;
    display:flex; flex-direction:column; gap:10px;
    box-shadow:0 1px 0 rgba(185,144,44,.05);
  }
  .card:hover{ transform:translateY(-3px); border-color:var(--cat-color); box-shadow:0 16px 30px -20px color-mix(in srgb, var(--cat-color) 70%, transparent); }

  .card .icon{
    width:58px; height:58px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--cat-color) 16%, transparent), transparent 70%),
               #fff;
    border:1px solid color-mix(in srgb, var(--cat-color) 45%, var(--hair));
    overflow:hidden;
  }
  .card .icon svg{ width:30px; height:30px; }
  .card .icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card h3{ font-size:16.5px; font-weight:600; line-height:1.35; }
  .card p.desc{ font-size:12.5px; color:var(--muted); line-height:1.5; flex:1; }
  .card .row{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .card .price{ font-family:'Cormorant Garamond', serif; font-size:22px; font-weight:600; color:var(--cat-color); }
  .card .price small{ font-size:11px; font-weight:400; color:var(--muted); margin-left:3px; font-family:'Noto Sans Thai';}

  .addbtn{
    border:1px solid var(--cat-color);
    background:transparent;
    color:var(--cat-color);
    width:38px; height:38px; border-radius:50%;
    font-size:19px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:.2s;
  }
  .addbtn:hover{ background:var(--cat-color); color:#fff; transform:scale(1.06); }

  .stepper{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--cat-color); border-radius:30px; padding:4px 6px;
  }
  .stepper button{
    width:26px; height:26px; border-radius:50%; border:none; cursor:pointer;
    background:var(--cat-color); color:#fff; font-size:15px; font-weight:700;
  }
  .stepper span{ min-width:16px; text-align:center; font-size:14px; font-weight:600; }

  .cart-fab{
    position:fixed; right:22px; bottom:22px; z-index:50;
    background:var(--ink); color:#f6ecd2;
    border:none; border-radius:30px;
    padding:14px 22px; display:flex; align-items:center; gap:10px;
    font-weight:600; font-size:14.5px; letter-spacing:.02em;
    cursor:pointer; box-shadow:0 14px 30px -10px rgba(43,33,19,.45);
    transition:.2s;
  }
  .cart-fab:hover{ transform:translateY(-2px); }
  .cart-fab .badge{
    background:var(--gold-bright); color:var(--ink);
    border-radius:50%; min-width:22px; height:22px; padding:0 5px;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(43,33,19,.35); backdrop-filter:blur(2px);
    z-index:60; opacity:0; pointer-events:none; transition:.25s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .cart-panel{
    position:fixed; top:0; right:0; height:100%; width:min(400px,92vw);
    background:#fff; border-left:1px solid var(--hair);
    z-index:70; transform:translateX(100%); transition:.32s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column;
  }
  .cart-panel.show{ transform:none; }
  .cart-head{ padding:22px 20px 16px; border-bottom:1px solid var(--hair); display:flex; justify-content:space-between; align-items:center; }
  .cart-head h3{ font-size:19px; font-weight:600; }
  .cart-head button{ background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; }
  .cart-items{ flex:1; overflow-y:auto; padding:14px 20px; display:flex; flex-direction:column; gap:14px; }
  .cart-empty{ text-align:center; color:var(--muted); font-size:13.5px; margin-top:60px; }
  .cart-item{ display:flex; gap:12px; align-items:center; border-bottom:1px dashed var(--hair); padding-bottom:12px; }
  .cart-item .ci-icon{ width:42px; height:42px; border-radius:50%; background:var(--panel-2); display:flex; align-items:center; justify-content:center; border:1px solid var(--hair); flex-shrink:0; overflow:hidden; }
  .cart-item .ci-icon svg{ width:22px; height:22px; }
  .cart-item .ci-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cart-item .ci-info{ flex:1; }
  .cart-item .ci-info h4{ font-size:13.5px; font-weight:500; }
  .cart-item .ci-info .ci-price{ font-size:12px; color:var(--muted); margin-top:2px; }
  .cart-item .ci-stepper{ display:flex; align-items:center; gap:8px; }
  .cart-item .ci-stepper button{ width:22px; height:22px; border-radius:50%; border:1px solid var(--hair); background:var(--panel-2); color:var(--ink); cursor:pointer; font-size:13px; }
  .cart-foot{ padding:18px 20px 22px; border-top:1px solid var(--hair); }
  .cart-foot .totalrow{ display:flex; justify-content:space-between; font-size:15px; margin-bottom:14px; }
  .cart-foot .totalrow strong{ font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--gold-deep); }
  .checkout-btn{
    width:100%; padding:14px; border:none; border-radius:10px;
    background:var(--ink); color:#f6ecd2; font-weight:700; font-size:14.5px;
    letter-spacing:.03em; cursor:pointer; transition:.2s;
  }
  .checkout-btn:hover{ background:#3d2f1a; }
  .checkout-btn:disabled{ opacity:.35; cursor:not-allowed; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
    background:var(--ink); color:#f6ecd2; padding:12px 22px; border-radius:30px;
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:.3s; z-index:100;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  footer{ text-align:center; padding:34px 20px 10px; color:var(--muted); font-size:12px; letter-spacing:.05em; }

  @media (max-width:520px){
    .grid{ grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:12px; }
    .card{ padding:16px 13px 14px; }
    .card h3{ font-size:14px; }
    .card .price{ font-size:19px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">De Warie Dining</div>
  <h1 class="serif">เดอ <span>วารี</span></h1>
  <p class="tag">สั่งอาหารออนไลน์ · เครื่องดื่ม · ขนมไทย · ซีฟู้ดย่าง · พาสต้า</p>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<button class="cart-fab" id="cartFab">
  ตะกร้า <span class="badge" id="cartBadge">0</span>
</button>

<div class="overlay" id="overlay"></div>
<aside class="cart-panel" id="cartPanel">
  <div class="cart-head">
    <h3 class="serif">ตะกร้าของคุณ</h3>
    <button id="closeCart">×</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="totalrow"><span>ยอดรวมทั้งหมด</span><strong id="cartTotal">0 บาท</strong></div>
    <button class="checkout-btn" id="checkoutBtn" disabled>ยืนยันสั่งอาหาร</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<footer>เดอ วารี · เปิดบริการทุกวัน 11:00 – 23:00 น.</footer>

const cart = {};
let activeCat = "drinks";

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');

function baht(n){ return n.toLocaleString('th-TH') + ' บาท'; }
function iconSVG(key, color){
  if(key && key.startsWith('img:')){
    const imgKey = key.slice(4);
    const img = IMAGES[imgKey];
    if(img) return `<img src="${img.src}" alt="" style="object-position:${img.pos}">`;
  }
  return `<span style="color:${color}">${ICONS[key] || ICONS.pastabowl}</span>`;
}

function buildTabs(){
  tabsEl.innerHTML = Object.keys(DATA).map(key=>{
    const c = DATA[key];
    return `<button data-cat="${key}" style="--cat-color:${c.color}" class="${key===activeCat?'active':''}">
      <span class="dot"></span>${c.label}
    </button>`;
  }).join('');
  tabsEl.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; render(); });
  });
}

function buildSections(){
  mainEl.innerHTML = Object.keys(DATA).map(key=>{
    const c = DATA[key];
    return `
    <section class="category ${key===activeCat?'active':''}" id="sec-${key}" style="--cat-color:${c.color}">
      <div class="section-head">
        <div class="eyebrow" style="color:${c.color}">${c.label}</div>
        <h2 class="serif">${c.label}</h2>
        <p>${c.desc}</p>
      </div>
      <div class="grid">
        ${c.items.map(it=>cardHTML(it, c.color)).join('')}
      </div>
    </section>`;
  }).join('');

  mainEl.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=> addToCart(btn.dataset.add, btn.dataset.cat));
  });
}

function cardHTML(it, color){
  const inCart = cart[it.id];
  return `
  <div class="card" style="--cat-color:${color}">
    <div class="icon">${iconSVG(it.icon, color)}</div>
    <h3>${it.th}<br><span style="font-size:11px;color:var(--muted);font-weight:400;">${it.name}</span></h3>
    <p class="desc">${it.desc}</p>
    <div class="row">
      <div class="price">${it.price}<small>บาท</small></div>
      ${inCart
        ? `<div class="stepper" data-id="${it.id}">
             <button data-step="-1">−</button>
             <span>${inCart.qty}</span>
             <button data-step="1">+</button>
           </div>`
        : `<button class="addbtn" data-add="${it.id}" data-cat="${findCat(it.id)}">+</button>`
      }
    </div>
  </div>`;
}

function findCat(id){
  for(const key in DATA){ if(DATA[key].items.find(i=>i.id===id)) return key; }
}

function addToCart(id, catKey){
  const item = DATA[catKey].items.find(i=>i.id===id);
  if(!cart[id]){
    cart[id] = { ...item, qty:1, color: DATA[catKey].color };
  } else {
    cart[id].qty++;
  }
  showToast(`เพิ่ม ${item.th} ลงตะกร้าแล้ว`);
  render();
}

function stepQty(id, delta){
  if(!cart[id]) return;
  cart[id].qty += delta;
  if(cart[id].qty <= 0) delete cart[id];
  render();
}

function render(){
  buildTabs();
  buildSections();
  attachStepperListeners();
  renderCart();
}

function attachStepperListeners(){
  mainEl.querySelectorAll('.stepper').forEach(st=>{
    const id = st.dataset.id;
    st.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=> stepQty(id, parseInt(b.dataset.step)));
    });
  });
}

const cartFab = document.getElementById('cartFab');
const cartPanel = document.getElementById('cartPanel');
const overlay = document.getElementById('overlay');
const closeCart = document.getElementById('closeCart');
const cartItemsEl = document.getElementById('cartItems');
const cartTotalEl = document.getElementById('cartTotal');
const cartBadge = document.getElementById('cartBadge');
const checkoutBtn = document.getElementById('checkoutBtn');

function openCart(){ cartPanel.classList.add('show'); overlay.classList.add('show'); }
function hideCart(){ cartPanel.classList.remove('show'); overlay.classList.remove('show'); }
cartFab.addEventListener('click', openCart);
closeCart.addEventListener('click', hideCart);
overlay.addEventListener('click', hideCart);

function renderCart(){
  const ids = Object.keys(cart);
  const totalQty = ids.reduce((s,id)=>s+cart[id].qty,0);
  const totalPrice = ids.reduce((s,id)=>s+cart[id].qty*cart[id].price,0);
  cartBadge.textContent = totalQty;
  cartTotalEl.textContent = baht(totalPrice);
  checkoutBtn.disabled = totalQty === 0;

  if(ids.length === 0){
    cartItemsEl.innerHTML = `<div class="cart-empty">ตะกร้าของคุณว่างเปล่า<br>เลือกเมนูที่ถูกใจได้เลย</div>`;
    return;
  }

  cartItemsEl.innerHTML = ids.map(id=>{
    const it = cart[id];
    return `
    <div class="cart-item">
      <div class="ci-icon">${iconSVG(it.icon, it.color)}</div>
      <div class="ci-info">
        <h4>${it.th}</h4>
        <div class="ci-price">${it.price} บาท × ${it.qty}</div>
      </div>
      <div class="ci-stepper" style="--cat-color:${it.color}">
        <button data-cid="${id}" data-cstep="-1">−</button>
        <span>${it.qty}</span>
        <button data-cid="${id}" data-cstep="1">+</button>
      </div>
    </div>`;
  }).join('');

  cartItemsEl.querySelectorAll('[data-cstep]').forEach(b=>{
    b.addEventListener('click', ()=> stepQty(b.dataset.cid, parseInt(b.dataset.cstep)));
  });
}

checkoutBtn.addEventListener('click', ()=>{
  showToast('สั่งอาหารสำเร็จ ขอบคุณค่ะ 🙏');
  for(const k in cart) delete cart[k];
  render();
  hideCart();
});

const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1800);
}

render();
</script>
